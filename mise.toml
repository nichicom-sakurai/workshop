[tools]
aws-cli = "2.34.63"
bun = "1.3.14"
gcloud = "571.0.0"
python = "3.13.13"
terraform = "1.15.5"

[env]
# gcloud は Python を同梱しないため、mise 管理の python3 を使わせる
# (未設定だとシステムの EOL Python を拾って起動失敗する)
CLOUDSDK_PYTHON = "python3"

[tasks.bootstrap]
alias = "bs"
description = "Bootstrap project dependencies and setup"
run = "./tools/bootstrap.sh"

# --- packages/* の実行タスク ---

[tasks.dev]
description = "指定プロジェクトを実行 (例: mise run dev aws)"
run = "mise exec -- bun run --cwd=packages/{{arg(name='project')}} start"

[tasks."dev:all"]
description = "packages 配下の全プロジェクトを実行"
run = """
for d in packages/*/; do
  echo "[${d}]"
  (cd "${d}" && mise exec -- bun run start)
done
"""

# --- terraform サンプルの実行タスク ---

[tasks.tf]
description = "terraform サンプルを実行 (例: mise run tf caller-identity plan)"
run = "mise exec -- terraform -chdir=packages/aws/terraform/examples/{{arg(name='example')}} {{arg(name='command', var=true)}}"