[tools]
aws-cli = "2.34.63"
bun = "1.3.14"
terraform = "1.15.5"
python = "3.13.13"
uv = "0.11.19"

[tasks.bootstrap]
alias = "bs"
description = "Bootstrap project dependencies and setup"
run = "./tools/bootstrap.sh"

# --- 実行タスク (project 名を packages/ → apps/ の順に解決) ---

[tasks.dev]
description = "指定プロジェクトを実行 (例: mise run dev aws / mise run dev openai)"
run = """
project="{{arg(name='project')}}"; dir="packages/${project}"; [ -d "${dir}" ] || dir="apps/${project}"
[ -d "${dir}" ] || { echo "[NG] project が見つかりません: ${project} (packages/ と apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" start
"""

[tasks."dev:all"]
description = "packages 配下の全プロジェクトを実行 (apps は対象外)"
run = """
for d in packages/*/; do
  echo "[${d}]"
  (cd "${d}" && mise exec -- bun run start)
done
"""

[tasks.chat]
description = "指定プロジェクトのチャットを起動 (例: mise run chat openai)"
run = """
project="{{arg(name='project')}}"; dir="packages/${project}"; [ -d "${dir}" ] || dir="apps/${project}"
[ -d "${dir}" ] || { echo "[NG] project が見つかりません: ${project} (packages/ と apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" chat
"""

[tasks.web]
description = "指定プロジェクトの Web チャット UI を起動 (例: mise run web openai)"
run = """
project="{{arg(name='project')}}"; dir="packages/${project}"; [ -d "${dir}" ] || dir="apps/${project}"
[ -d "${dir}" ] || { echo "[NG] project が見つかりません: ${project} (packages/ と apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" web
"""

# --- terraform サンプルの実行タスク ---

[tasks.tf]
description = "terraform サンプルを実行 (例: mise run tf caller-identity plan)"
run = "mise exec -- terraform -chdir=packages/aws/terraform/{{arg(name='example')}} {{arg(name='command', var=true)}}"

# --- git hooks ---

[tasks.install-hooks]
description = "git commit-msg フックを有効化 (core.hooksPath = tools/git-hooks)"
run = "git config core.hooksPath tools/git-hooks"
