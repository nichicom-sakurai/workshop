[tools]
aws-cli = "2.34.63"
bun = "1.3.14"
terraform = "1.15.5"
python = "3.13.13"
uv = "0.11.19"

[tasks.bootstrap]
alias = "bs"
description = "Bootstrap project dependencies and setup"
run = "./tools/bootstrap.sh"

# --- 実行タスク (runnable プロジェクトを apps/ から解決) ---
# terraform/<provider> は Terraform 置き場で package.json を持たないため解決対象外。
# runnable な app は apps/ 配下 (openai / cost-estimator など)。

[tasks.dev]
description = "指定プロジェクトを実行 (例: mise run dev openai / mise run dev cost-estimator)"
run = """
project="{{arg(name='project')}}"; dir="apps/${project}"
[ -f "${dir}/package.json" ] || { echo "[NG] runnable project が見つかりません: ${project} (apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" start
"""

[tasks.chat]
description = "指定プロジェクトのチャットを起動 (例: mise run chat openai)"
run = """
project="{{arg(name='project')}}"; dir="apps/${project}"
[ -f "${dir}/package.json" ] || { echo "[NG] runnable project が見つかりません: ${project} (apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" chat
"""

[tasks.web]
description = "指定プロジェクトの Web チャット UI を起動 (例: mise run web openai)"
run = """
project="{{arg(name='project')}}"; dir="apps/${project}"
[ -f "${dir}/package.json" ] || { echo "[NG] runnable project が見つかりません: ${project} (apps/ を確認)" >&2; exit 1; }
mise exec -- bun run --cwd="${dir}" web
"""

# --- terraform サンプルの実行タスク ---

[tasks.tf]
description = "terraform サンプルを実行 (例: mise run tf caller-identity plan)"
run = "mise exec -- terraform -chdir=terraform/aws/{{arg(name='example')}} {{arg(name='command', var=true)}}"

# --- git hooks ---

[tasks.install-hooks]
description = "git commit-msg フックを有効化 (core.hooksPath = tools/git-hooks)"
run = "git config core.hooksPath tools/git-hooks"
